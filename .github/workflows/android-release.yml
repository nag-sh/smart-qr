name: Android Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd client
          npm version --no-git-tag-version "$VERSION"

      - name: Sync Android version
        run: node scripts/sync-android-version.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build mobile web assets
        working-directory: client
        run: npm run build:mobile

      - name: Sync Capacitor Android project
        working-directory: client
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > client/android/app/smartqr-release.keystore

      - name: Assemble release APK
        working-directory: client/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew assembleRelease

      - name: Create GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: '**/android/app/build/outputs/apk/release/*.apk'
